<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Snowfall Hollow · An Advent Calendar</title>
<meta name="description" content="A cozy snowy-village advent calendar with 25 days of stories, games, recipes and crafts.">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Ccircle cx='32' cy='36' r='22' fill='%23c87790'/%3E%3Crect x='26' y='8' width='12' height='8' rx='2' fill='%23c99d3a'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;0,700;1,500;1,600&family=Lora:ital,wght@0,400;0,600;1,400&display=swap" rel="stylesheet">
<link rel="preload" as="image" href="assets/village.webp" fetchpriority="high">
<link rel="stylesheet" href="css/style.css?v=6">
<meta name="theme-color" content="#7a6ea6">
</head>
<body>
  <header class="topbar">
    <h1>Snowfall Hollow <span>an Advent Calendar</span></h1>
    <div class="top-actions">
      <span id="status" class="status"></span>
      <button id="settingsBtn" class="pill icon" title="Change names" aria-label="Settings">⚙</button>
      <button id="musicBtn" class="pill" aria-pressed="false" title="Music box">♪ <span class="lbl">Music</span></button>
    </div>
  </header>

  <main id="sceneWrap" class="scene-wrap">
    <div id="scene" class="scene"></div>
    <canvas id="snow" class="snow" aria-hidden="true"></canvas>
  </main>

  <div id="welcome" class="welcome" aria-live="polite"></div>
  <p class="hint" id="hint">Tap a glowing ornament to open today's surprise</p>

  <div id="modal" class="modal" hidden>
    <div class="modal-backdrop" data-close></div>
    <div class="modal-panel" role="dialog" aria-modal="true" aria-labelledby="modalTitle">
      <button class="modal-close" data-close aria-label="Close">×</button>
      <div class="modal-head">
        <div class="modal-day" id="modalDay"></div>
        <h2 id="modalTitle"></h2>
        <div class="modal-kind" id="modalKind"></div>
      </div>
      <div class="modal-body" id="modalBody"></div>
    </div>
  </div>

  <div id="namesScreen" class="names-screen" hidden>
    <div class="names-card" role="dialog" aria-modal="true" aria-labelledby="namesTitle">
      <div class="names-art" aria-hidden="true"></div>
      <div class="names-orn" aria-hidden="true">✦</div>
      <p class="names-kicker">Welcome to</p>
      <h2 id="namesTitle">Snowfall Hollow</h2>
      <p class="names-lead">Who is opening this advent calendar? Add one name or a few, and they'll appear in the stories and games.</p>
      <form id="namesForm" autocomplete="off">
        <div id="nameFields" class="name-fields"></div>
        <button type="button" id="addName" class="pill ghost">+ Add another name</button>
        <div class="names-actions">
          <button type="button" id="skipNames" class="pill ghost">Skip for now</button>
          <button type="submit" class="pill gold big">Open the calendar</button>
        </div>
      </form>
    </div>
  </div>

  <div id="toast" class="toast" hidden></div>

  <script src="js/names.js?v=6"></script>
  <script src="js/scene.js?v=6"></script>
  <script src="js/stories.js?v=6"></script>
  <script src="js/games.js?v=6"></script>
  <script src="js/ispy-data.js?v=6"></script>
  <script src="js/ispy.js?v=6"></script>
  <script src="js/days.js?v=6"></script>
  <script src="js/app.js?v=6"></script>
</body>
</html>
